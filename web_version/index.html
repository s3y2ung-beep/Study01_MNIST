<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손글씨 숫자 인식</title>
  <link rel="stylesheet" href="스타일.css">
</head>
<body>
  <main>
    <h1>손글씨 숫자 인식</h1>
    <p class="작성자">2601938 박소영</p>
    <p id="상태" class="상태">모델을 불러오는 중입니다.</p>
    <canvas id="그림판" width="280" height="280" aria-label="숫자를 그리는 그림판"></canvas>
    <section class="결과칸">
      <div>
        <div class="제목">인식 결과</div>
        <div id="결과" class="결과">?</div>
      </div>
      <ol id="후보" class="후보"></ol>
    </section>
    <button id="지우기" type="button">지우기</button>
    <p class="설명">마우스나 손가락으로 0~9 숫자 하나를 그리고 손을 떼면 인식합니다.
      모든 계산은 이 브라우저 안에서 순수 자바스크립트로 이루어집니다.
      <a href="검증.html">검증 페이지</a></p>
  </main>
  <noscript>자바스크립트를 켜야 동작합니다.</noscript>
  <script type="module" src="앱.js"
          onerror="document.getElementById('상태').textContent='스크립트를 불러오지 못했습니다. 파일을 더블클릭하지 말고 웹 서버로 여세요.'"></script>
</body>
</html>
